Widget.ConstrainedBox.Description=Constrain an optional child with required minimum and maximum width and height bounds. Palette creation starts unconstrained; unbounded and expanding axes remain explicit.
Widget.UnconstrainedBox.Description=Let an optional child keep its natural size by removing constraints from both axes or retaining exactly one axis, with explicit alignment, direction, and clipping controls.
Widget.LimitedBox.Description=Apply optional maximum width and height only when the corresponding incoming axis is unbounded, while preserving bounded parent constraints and an optional child.
Widget.OverflowBox.Description=Override any combination of the incoming minimum and maximum width or height constraints, align the optional child, and choose whether this box adopts the largest permitted size or follows its child within the parent constraints.
Widget.Baseline.Description=Position an optional child so its alphabetic or ideographic baseline sits at a required logical-pixel offset from the top. Palette creation starts at offset 24 with the alphabetic baseline.
Widget.IntrinsicHeight.Description=Size an optional child to its intrinsic height before final layout. This adds a speculative layout pass and can be O(N²) in tree depth, so avoid it when constraints can express the layout.
Widget.IntrinsicWidth.Description=Size an optional child to its maximum intrinsic width, optionally snapping width and height to non-negative step multiples while honoring parent constraints. A null or zero stepWidth uses the maximum intrinsic width; a null or zero stepHeight leaves height unconstrained. This adds a speculative layout pass and can be O(N²) in tree depth.
Widget.Offstage.Description=Keep an optional child laid out and active while optionally removing it from paint, hit testing, and the parent layout space. An offstage child can still receive focus and run animations; remove it from the tree instead when hiding it long-term.
Widget.SizedOverflowBox.Description=Request a required logical size while passing the original parent constraints unchanged to an optional child. Parent constraints still constrain this box; alignment positions a differently sized child, which may paint outside the box.
Widget.Transform.Description=Apply a required finite 4×4 Matrix4 to an optional child during painting without changing its layout size, with origin, alignment, transformed-hit-test, and filter-quality controls. Palette creation starts with the identity matrix.
Widget.RotatedBox.Name=RotatedBox
Widget.RotatedBox.Description=Rotate an optional child clockwise by a required signed number of quarter turns before layout. Odd quarter turns swap the child’s width and height; palette creation starts at one quarter turn.
Widget.ListBody.Name=ListBody
Widget.ListBody.Description=Arrange an ordered child list sequentially along a vertical or horizontal main axis, stretching every child to the parent dimension on the cross axis. ListBody does not scroll; palette creation preserves Flutter’s vertical-axis and forward-order defaults.
Widget.OverflowBar.Name=OverflowBar
Widget.OverflowBar.Description=Lay out an ordered child list in one horizontal row while it fits, then switch the same children to a vertical overflow column when their total width exceeds the available width. Palette creation preserves Flutter’s zero spacing, start overflow alignment, downward overflow direction, and ambient text direction defaults.
Widget.GridViewCount.Name=GridView.count
Widget.GridViewCount.Description=Create a static scrolling grid with a required positive cross-axis count and exact ordered children. Palette creation starts with two columns and preserves Flutter’s vertical scrolling, unit child aspect ratio, zero spacing, and default child lifecycle, clipping, semantics, and restoration behavior.
Widget.SingleChildScrollView.Name=SingleChildScrollView
Widget.SingleChildScrollView.Description=Create one optional child inside a vertically or horizontally scrolling viewport. Palette creation preserves Flutter’s vertical, forward, platform-physics, opaque hit-test, hard-edge clipping, inherited keyboard-dismissal, and ambient primary-controller defaults; runtime controller state remains outside this Designer slice.
Widget.ColoredBox.Name=ColoredBox
Widget.ColoredBox.Description=Paint a required solid color behind one optional child using Flutter’s dedicated render object. Palette creation starts with an editable opaque blue literal; anti-aliasing preserves Flutter’s enabled default when unset.
Widget.SafeArea.Name=SafeArea
Widget.SafeArea.Description=Wrap an existing widget so MediaQuery padding keeps it clear of system intrusions on selected sides. The wrapper preserves Flutter’s four enabled sides, zero minimum inset, and disabled bottom-view-padding maintenance defaults until explicitly edited.
Widget.Placeholder.Name=Placeholder
Widget.Placeholder.Description=Draw Flutter’s development placeholder frame and diagonals around one optional child. Omitted color, stroke width, and unbounded-axis fallback dimensions preserve Flutter’s blue-grey, 2, and 400 × 400 defaults.
Widget.Directionality.Name=Directionality
Widget.Directionality.Description=Wrap an existing widget with an explicit inherited text-flow direction. Palette creation starts left-to-right; the required child remains occupied and can only be replaced, while Text direction can be switched between LTR and RTL.
Widget.DecoratedBox.Name=DecoratedBox
Widget.DecoratedBox.Description=Paint a reviewed BoxDecoration behind or in front of one optional child. Palette creation starts with an empty rectangular decoration behind the child; color or theme color, image, border, radius, shadows, gradient, blend mode, and shape remain editable through the typed decoration editor.
Widget.ExcludeSemantics.Name=Exclude Semantics
Widget.ExcludeSemantics.Description=Remove one optional child subtree from Flutter's accessibility semantics tree while preserving its layout, painting, and hit testing. Omission preserves Flutter's excluding=true default; an explicit false keeps descendant semantics.
Widget.IndexedStack.Name=Indexed Stack
Widget.IndexedStack.Description=Lay out every ordered child while painting, hit-testing, and exposing semantics for only the selected index. Omit Index for Flutter's default 0, set an explicit non-negative index to select a child, or set null to show none.
Widget.ClipRect.Name=ClipRect
Widget.ClipRect.Description=Clip one optional child to the widget's rectangular bounds. Omit Clip behavior for Flutter's hard-edge default; custom clippers remain outside the closed Designer model.
Widget.ClipOval.Name=ClipOval
Widget.ClipOval.Description=Clip one optional child to the oval inscribed in this widget's bounds. Omit Clip behavior for Flutter's anti-alias default; custom clippers remain outside the closed Designer model.
Widget.ClipRRect.Name=ClipRRect
Widget.ClipRRect.Description=Clip one optional child to rounded rectangular bounds. Border radius supports physical and direction-aware elliptical corners; omitted values preserve BorderRadius.zero and anti-alias clipping. Custom clippers are typed CustomClipper<RRect> references that override borderRadius; project delegate preview is explicitly unavailable in the isolated Canvas.
Widget.ClipPath.Name=ClipPath
Widget.ClipRSuperellipse.Name=ClipRSuperellipse
Widget.PhysicalModel.Name=PhysicalModel
Widget.PhysicalModel.Description=Paint one optional child on an elevated physical surface. Configure rectangle or circle shape, physical elliptical border radii, clipping, elevation, required surface color and shadow color. Circle shape ignores but preserves border radius; omission preserves Flutter defaults.
Widget.ClipRSuperellipse.Description=Clip one optional child to rounded superellipse bounds. Border radius supports physical and direction-aware elliptical corners; omission preserves BorderRadius.zero and anti-alias clipping. A typed CustomClipper<RSuperellipse> overrides borderRadius; project delegate preview is explicitly unavailable in the isolated Canvas.
Widget.ClipPath.Description=Clip one optional child with either a project CustomClipper<Path> or a ShapeBorder. Clipper and Shape are mutually exclusive; Shape selects the non-const ClipPath.shape helper. Omitted Clip behavior preserves anti-alias clipping.

Widget.PhysicalShape.Name=PhysicalShape
Widget.RepaintBoundary.Name=RepaintBoundary
Widget.MergeSemantics.Name=MergeSemantics
Widget.IndexedSemantics.Name=IndexedSemantics
Widget.ExcludeFocus.Name=ExcludeFocus
Widget.ExcludeFocus.Description=Wrap an existing widget with a required child to exclude descendant focus. Excluding defaults to true; changing to true unfocuses descendants, while false permits focus without automatically restoring it. Layout, paint, pointer hits and Designer editing remain available. Edit Excluding with checkbox/unset and replace Child atomically in Slots; no empty child is created.
Widget.ExcludeFocusTraversal.Name=ExcludeFocusTraversal
Widget.Visibility.Name=Visibility
Widget.TickerMode.Name=TickerMode
Widget.DefaultTextHeightBehavior.Name=DefaultTextHeightBehavior
Widget.DefaultSelectionStyle.Name=DefaultSelectionStyle
Widget.DefaultSelectionStyle.Description=Wrap an existing required child with cursor color, selection color and mouse cursor defaults. All three SDK fields are optional. Colors support literal and semantic theme values with previews; Mouse cursor has 41 closed presets, including MouseCursor.defer/uncontrolled and three WidgetStateMouseCursor presets. Merge is a required Designer-only choice created as false, not a nullable SDK property. True uses DefaultSelectionStyle.merge and inherits unset fields; false uses the direct constructor and clears them. Local selection settings can override these defaults; this does not make a child selectable. Edit the centered Merge checkbox, which cannot be unset or reset, and replace Child atomically; Designer selection and editing remain available.
Widget.DefaultTextHeightBehavior.Description=Wrap an existing required child with the nearest inherited TextHeightBehavior default. Two optional Apply checkboxes and Leading distribution preserve true/true/proportional when unset. The required behavior object is always emitted, even with every leaf unset; this does not pass through an outer behavior. Local or nearer text-height behavior can override it. Flags affect text with a height multiplier; no font size or height is invented. Replace Child atomically; Designer selection and editing remain available.
Widget.TickerMode.Description=Wrap an existing required child to control widget-aware tickers. Enabled is required: creation supplies true, not an SDK default, and false is valid. Nested Enabled values combine with ancestor values using AND; Force frames defaults to false and combines using OR independently. Muted callbacks stop but elapsed time continues. Forcing frames can increase battery usage. Edit centered checkboxes and replace Child atomically; layout, paint, pointer hits, focus and Designer editing remain available.
Widget.Visibility.Description=Wrap an existing required child to control visibility and retain selected state, animation, size, semantics, interactivity and focusability. Visible defaults to true and all Maintain flags default to false. Required flag dependencies are edited atomically; changing Maintain flags can discard descendant state. An optional Replacement is ignored while Maintain state is true; clearing it preserves Flutter's SizedBox.shrink default. All six Maintain flags true represent Visibility.maintain. Designer selection and editing remain available.
Widget.ExcludeFocusTraversal.Description=Wrap an existing widget with a required child to exclude descendant keyboard focus traversal. Excluding defaults to true; Tab traversal skips descendants, but direct requestFocus remains allowed and existing focus is retained. Local skipTraversal configuration is not rewritten. Layout, paint, pointer hits and Designer editing remain available. Edit Excluding with checkbox/unset and replace Child atomically in Slots; no empty child is created.
Widget.IndexedSemantics.Description=Annotate one optional child's accessibility position with a required signed integer index. Creation starts at 0; negative values are supported and Index cannot be unset. The index does not sort children, create a label or change layout, painting or pointer hit testing. Edit Index in Properties and Child in Slots; descendants remain editable.
Widget.MergeSemantics.Description=Merge the optional child's semantics subtree into one node. Labels are joined with newlines; the first handler in tree order wins for a shared action, and conflicting states follow Flutter semantics rules. No scalar constructor properties: edit Child in Slots or select a descendant. Layout and pointer hit testing remain unchanged; isolated preview does not execute project callbacks.
Widget.IgnorePointer.Name=IgnorePointer
Widget.AbsorbPointer.Name=AbsorbPointer
Widget.BlockSemantics.Name=BlockSemantics
Widget.BlockSemantics.Description=Hide earlier-painted semantic nodes in the same semantics container. Blocking defaults to true; false disables this effect. Own child and later nodes remain, unlike ExcludeSemantics. Layout, painting, and pointer hit testing are unchanged, unlike AbsorbPointer. Optional child and the centered boolean checkbox remain editable; Restore Default returns to <not set>.
Widget.AbsorbPointer.Description=Stop pointer hit testing at one optional child while preserving layout and painting. Absorbing defaults to true and blocks the child and targets behind it; unlike IgnorePointer, events do not pass through. Both booleans are editable. Deprecated Ignoring semantics: unset/default null keeps labels but blocks user actions while absorbing, false preserves actions, true excludes the entire semantics subtree. Designer selection and editing remain available.
Widget.IgnorePointer.Description=Ignore pointer hits for one optional child while preserving layout and painting. Ignoring defaults to true; targets behind may receive events. Both booleans are editable. Deprecated Ignoring semantics: unset/default null keeps labels but blocks user actions while ignoring, false preserves actions, true excludes the entire semantics subtree. Designer editing remains available.
Widget.RepaintBoundary.Description=Isolate one optional child's painting in a separate display list. No scalar properties: edit Child in Slots or select a descendant. Layout, hit testing and semantics remain unchanged; additional layers are not a guaranteed performance improvement. Designer owns widget identity; wrap/wrapAll convenience helpers do not add a childIndex property.
Widget.PhysicalShape.Description=Paint one optional child on an elevated path-shaped surface. Configure a built-in ShapeBorderClipper or project CustomClipper<Path>, clipping, elevation, required color and shadow color. Built-in shapes render in Canvas; custom project clip, fill and shadow preview is explicitly unavailable.
