Widget.TooltipTheme.Name=TooltipTheme
Widget.MenuItemButton.Name=MenuItemButton
Widget.MenuAnchor.Name=MenuAnchor
Widget.SubmenuButton.Name=SubmenuButton
Widget.MenuBar.Name=MenuBar
Widget.MenuBar.Description=Horizontal Material menu bar with a required list of menu-entry children, nullable controller, Clip behavior and complete MenuStyle editing. Whole Style and local leaves are mutually exclusive; project controllers and styles remain references and are never executed in isolated Canvas. Save/reopen and Undo/Redo preserve child order and identities.
Widget.NavigationBar.Name=NavigationBar
Widget.NavigationBar.Description=Material navigation bar with a required destinations list, selected index, optional destination callback, animation, colors, indicator, labels and safe-area settings. Destinations are edited in Slots; project callbacks and typed references remain application-owned and are never executed in isolated Canvas. Save/reopen and Undo/Redo preserve destination order and identities.
Widget.NavigationRail.Name=NavigationRail
Widget.NavigationRail.Description=Material navigation rail with optional leading and trailing widgets, a required destination list, nullable selection, extension, indicator, label, alignment and sizing controls. Destination callbacks and project-owned references remain application-owned and are never executed in isolated Canvas. Save/reopen and Undo/Redo preserve slot identities and order.
Widget.NavigationDrawer.Name=NavigationDrawer
Widget.NavigationDrawer.Description=Material navigation drawer with optional header and footer widgets, a required destination list, nullable selection, theme-aware colors, indicator and tile padding. Destination callbacks and project-owned references remain application-owned and are never executed in isolated Canvas. Save/reopen and Undo/Redo preserve slot identities and order.
Widget.Drawer.Name=Drawer
Widget.Drawer.Description=Material drawer surface with theme-aware colors, optional shape and child content, semantic label, width and clipping. Project-owned ShapeBorder references remain application-owned and are never executed in isolated Canvas. Save/reopen and Undo/Redo preserve child identity and property values.
Widget.BottomAppBar.Name=BottomAppBar
Widget.BottomAppBar.Description=Material bottom app bar with theme-aware colors, elevation, optional padding, height, notch margin and child content. Project-owned NotchedShape references remain application-owned and are never executed in isolated Canvas. Save/reopen and Undo/Redo preserve child identity and property values.
Widget.BottomNavigationBar.Name=BottomNavigationBar
Widget.BottomNavigationBar.Description=Material bottom navigation bar with a required ordered item list, selected index, callback, colors, icon and label controls, landscape layout and feedback settings. Items are edited in Slots; project-owned callbacks, themes and style references remain application-owned and are never executed in isolated Canvas. Save/reopen and Undo/Redo preserve item order and identities.
Widget.Material.Name=Material
Widget.Material.Description=Material surface with reviewed type, elevation, colors, shape, clipping, animation and optional child controls. Project-owned TextStyle and ShapeBorder references remain application-owned and are never executed in isolated Canvas. Save/reopen and Undo/Redo preserve the exact values and child identity.
Widget.Scrollbar.Name=Scrollbar
Widget.Scrollbar.Description=Wrap a required scrollable Child with a Material Scrollbar. Configure nullable thumb and track visibility, thickness, interaction, controller, notification predicate, Radius reference and orientation. Explicit booleans use centered checkboxes; <not set> preserves ScrollbarThemeData and platform defaults. Left/right orientations are for vertical scrolling and top/bottom for horizontal scrolling. Project-owned controllers, predicates and Radius references are retained and analyzed but never executed in isolated Canvas. Save/reopen and Undo/Redo preserve the child identity and all values.
Widget.SubmenuButton.Description=Native self-opening submenu with all 721 typed properties: 16 SDK arguments, 498 local ButtonStyle leaves, 203 separate MenuStyle leaves and four local submenu-icon states. Button style, Menu style and Submenu icon are independent atomic compounds; editing one preserves the others. Child is required but nullable; empty emits child: null. Menu children is required but may be empty, which disables the native opener. Leading icon and Trailing icon are optional. Five native Events cover hover, focus, opening, closing and animation status; there is no On pressed, Enabled selector or builder template. Use root overlay and Animated support State with independent literal Canvas previews. Exact signed hover delay microseconds and strict Duration references retain precision; positive delay is invalid directly inside a native MenuBar. Icon states resolve Disabled, Hovered, Focused, then Default; omitted buckets skip, explicit null falls back to the theme arrow, and Material None is an empty Icon. Project code is analyzed but never executed in Canvas. Save/reopen and Undo/Redo retain all child IDs, order and user-owned bodies.
Widget.MenuAnchor.Description=Native menu anchor with all 219 typed properties: all 16 SDK arguments and 203 local MenuStyle leaves or a complete style reference. Child is optional; Menu children is a required list that may be empty. Ordinary Add preserves both slots without fabricating children. Three native Events cover opening, closing and AnimationStatus. Four effective boolean State consumers are supported; deprecated anchorTapClosesMenu is retained but inert in the pinned SDK. Native menu panels and cursors resolve MenuStyle with empty states; non-default buckets are preserved, not falsely previewed as hover/pressed styles. Create Menu Builder is an explicit source action that adds a user-editable TextButton toggle template, using Child as content without rewiring its handlers. Canvas Preview menu uses an isolated controller and never executes project builders, callbacks or controllers. Save/reopen and Undo/Redo preserve source and child identities.
Widget.MenuItemButton.Description=Menu item with all 520 typed properties: all 498 local ButtonStyle leaves across nine state buckets or a whole style reference, plus complete focus, hover, clipping, overflow, semantics and shortcut configuration. Child, Leading icon and Trailing icon are all optional; ordinary Add is valid without children. Three native Events: On pressed, On hover and On focus change. Enabled is a required Designer activation selector; no enabled argument or long-press callback is invented. Four independent boolean State consumers preserve centered literal previews. Shortcuts are display hints, not global key registrations: use all 432 reviewed LogicalKeyboardKey triggers or a CharacterActivator character with supported modifiers. Choose an anchor first; no key is invented. Whole/local and key/character changes are atomic, and Undo restores the prior branch. Project callbacks, shortcut factories, styles and layer builders are never executed in isolated Canvas. Save/reopen and history preserve all three child IDs and user-owned source.
Widget.TooltipTheme.Description=Wrap an existing widget as the required Child with a complete nearest TooltipThemeData. All 47 properties support a strict whole Data reference/getter/member/factory or all 46 local leaves: geometry, structured decoration, all 31 TextStyle leaves including Paint/font/locale, three exact signed microsecond durations, trigger mode and nullable booleans. Whole Data conflicts with every local value, explicit null and State binding; reset conflicts explicitly, without silent data loss. Inner Height/Constraints and whole/local TextStyle edits are atomic. With all leaves unset, const TooltipThemeData() is emitted, not an outer-theme merge. Local Tooltip properties override the theme. Three nullable booleans support State and centered literal preview checkboxes. No native Events are invented. Project Dart never executes in isolated Canvas; unknown theme values are explicitly approximate. Child replacement, Save/reopen and Undo/Redo preserve stored IDs and user source.
Widget.TooltipVisibility.Description=Wrap an existing widget as the required Child to control descendant Tooltip display. Visible is required: creation supplies true, not an SDK default; false is valid and cannot be unset. The nearest scope wins, so a nearer true overrides an outer false. Disabling suppresses Tooltip display without hiding the child or its interaction. Overlay dismissal and Tooltip annotations follow the installed Flutter SDK; child accessibility remains available. The centered Visible checkbox supports State bindings with an independent literal Canvas preview. Child replacement and palette wrapping are atomic and preserve widget IDs, source code and Undo/Redo. There are no native Events or application callbacks on this wrapper.
Widget.Tooltip.Description=Add Tooltip with an editable plain message and optional Child, or use Wrap with Tooltip to preserve an existing anchor widget. All 53 properties cover plain/rich content, complete local TextStyle, structured BoxDecoration, constraints, spacing, three exact microsecond durations, mouse cursors, feedback and semantics. Rich message accepts a strict InlineSpan reference/factory: TextSpan, WidgetSpan and custom span trees remain user-owned Dart. Message/Rich message, Height/Constraints and whole/local Text style switch atomically. The final non-null content cannot be cleared; no fallback text is fabricated. On triggered uses shared Events; Position delegate is a typed Offset function in Properties, not an Event. Null/omission stay distinct, booleans use centered checkboxes, and Save/reopen/Undo preserve Child and user code. Project values never execute in isolated Canvas; custom content and positioning are explicitly approximate. Manual mode still allows mouse hover.
Widget.ExpansionTile.Description=Wrap the selected widget as required Title of ExpansionTile; expanded content goes in Children. Optional Leading, Subtitle and Trailing slots remain independent. All 76 properties include both expanded/collapsed shape families, padding/alignment, density, colors, controllers, feedback, accessibility and complete AnimationStyle. Initially expanded is only a seed, not a controlled value or a two-way State binding. On expansion changed uses the shared Events workflow. Whole/local shape and animation values switch atomically. Signed microsecond durations, 43 Curve presets, noAnimation, explicit null and typed project references are supported. The pinned SDK ignores reverseDuration even though it is retained and generated. Project controllers, curves, styles and callbacks are never executed in isolated Canvas. Source lifecycle, child identities, Save/reopen and Undo are preserved.
Widget.RadioListTile.Description=Add RadioListTile or RadioListTile.adaptive with all typed properties and optional Title, Subtitle and Secondary slots. Modern RadioGroup is the preferred group owner. Legacy Group value and On changed remain available; callback omission, explicit null and No-op are distinct. Required Value, Value type and Constructor start as option, String and Standard. The Value type dialog edits Type, nullability, Value, Group value and On changed in one atomic transaction; handler bodies and child slots remain unchanged. Six built-in types and simple project types/typedefs are supported. Whole references and local shape, density, state color, radio side, inner radius and cursor families switch atomically. No groupRegistry or focusColor field is invented. Standard retains the inactive Cupertino checkmark flag without emitting it; Adaptive restores it. Three line requires Subtitle. Concrete Boolean values use centered checkboxes. Events and legacy State bindings use the shared verified workflow; isolated Canvas never executes user code. Save, reopen and Undo preserve all three children.
Widget.SwitchListTile.Description=Add SwitchListTile or SwitchListTile.adaptive with 236 typed properties and optional Title, Subtitle and Secondary slots. Required Value starts false and On changed starts No-op; explicit null On changed disables the tile. No Enabled or Tristate field is invented. Four Events and controlled bool State binding share the existing workflow. Both constructors retain all properties; Standard stores Apply Cupertino theme without emitting it and Adaptive uses it. All nine thumb Icon states, local colors, cursor states, shape, density and declared thumb images have typed editors. Whole references and local families switch atomically. Resetting an image clears only its matching error callback. Three line requires Subtitle; clearing or moving it is blocked until Three line is disabled or Subtitle is replaced. Optional omission and null stay distinct. Concrete Booleans use centered checkboxes. Project callbacks and object references are analyzed but never executed in isolated Canvas. Save, reopen and Undo preserve all three child slots.
Widget.CheckboxListTile.Description=Add a complete CheckboxListTile or adaptive CheckboxListTile with 154 typed properties and three optional Title, Subtitle and Secondary slots. No child is fabricated. Mixed Value enables Tristate; disabling Tristate while mixed sets Value false in one undoable edit. On changed is required: choose No-op, explicit null or a typed project callback. Enabled is independently nullable and never removes the callback. Three line requires an existing Subtitle; clearing or moving it is blocked until Three line is disabled or Subtitle is replaced. Both tile Shape and Checkbox shape have independent built-in and project-reference branches. Whole values and local color, side, density and cursor families switch atomically; one Undo restores affected fields. Cursor state maps require an explicit Default. Optional omission and null remain distinct, Boolean values use centered checkboxes, and all three slots survive Save/reopen. Isolated Canvas reports unavailable project values and unsafe geometry without executing project code.
Widget.ListTile.Name=ListTile
Widget.ListTile.Description=Add a complete Material ListTile with 176 typed properties and four optional Leading, Title, Subtitle and Trailing slots. No title or callback is fabricated. Three line requires an existing Subtitle; clearing or moving that subtitle is blocked until Three line is disabled or Subtitle is replaced. Whole references and local shape, TextStyle, density and state maps switch atomically; one Undo restores affected values. State colors and cursors require an explicit Default before any other local state. All constructor callbacks, focus and state controllers are retained, including when disabled. Optional omission and explicit null remain distinct; concrete Boolean values use centered checkboxes. Physical/directional padding, literal/theme/project colors and signed geometry including closed Infinity and NaN constants are editable. Isolated Canvas reports unsafe geometry and unavailable project values without executing project code. Save/reopen preserves all four slots and typed properties.
Widget.RadioGroup.Name=RadioGroup
Widget.RadioGroup.Description=Wrap an existing widget in a controlled RadioGroup with all four typed properties. Child is required and is never fabricated or silently deleted. Value Type is created String and the required On Changed callback is created as the explicit No-op preset; callback null and omission are rejected. Group Value supports exact literals, explicit null and analyzer-verified project references, including closed double Infinity, negative Infinity and NaN identities. The Value Type dialog edits type, nullability and Group Value atomically; one Undo restores all three. The callback and all descendant Radio types and values remain unchanged. Only radios with exactly matching T, including nullability, join the nearest group. Optional omission remains distinct from explicit values; concrete Boolean values use centered checkboxes. Project callbacks are never executed in isolated Canvas. Save/reopen preserves typed state and the required child.
Widget.Radio.Name=Radio
Widget.Radio.Description=Create a controlled Radio leaf with all 107 typed properties and Standard/Adaptive constructors. Value is created 'option', Value type String and On changed the explicit No-op preset. A closed type selector accepts six built-in types or simple project class, enum or typedef symbols; its Type/Value/Group value draft commits all dependent values atomically without discarding callbacks or registry references. Literal values, explicit null and analyzer-verified project values remain distinct. Enabled is the actual nullable SDK argument, not a designer callback switch. Three color families and Inner radius support nine state entries each; explicit null stops lower entries and defers to the SDK/theme. Plain or stateful Side exposes all 45 local fields. Whole typed references switch atomically with their own local family, including Visual density. Selecting Standard clears only the Adaptive-only checkmark flag. Both constructors retain other ignored platform arguments. Concrete Booleans use centered checkboxes; optional omission and explicit null are preserved. Project references are analyzed but never executed in isolated Canvas. No child slots are available; save/reopen and one Undo preserve typed state.
Widget.RangeSlider.Name=RangeSlider
Widget.RangeSlider.Description=Create a controlled RangeSlider leaf with required Start value 0, End value 1 and Enabled true. Its single non-const constructor has all 37 typed properties, including continuous/discrete divisions, exact signed finite or Infinity endpoints, physical/directional padding and nullable year appearance. Invalid ranges and reversed endpoints are rejected without clamping. Whole RangeLabels references or explicit null switch atomically with local start/end labels; a missing local peer becomes an empty string. Whole WidgetStateProperty overlay and mouse cursor references switch atomically with nine local state entries. An explicit null stops lower local states and uses the SDK/theme fallback; omission remains separate. Local cursors support 41 reviewed presets or strict MouseCursor project references. Concrete Booleans use centered checkboxes. Project callbacks and formatter are verified but never executed in isolated Canvas; disabling retains all callbacks and emits only onChanged:null. Optional fields can be reset. Save/reopen and one Undo preserve exact typed states.
Widget.Slider.Name=Slider
Widget.Slider.Description=Create Slider or Slider.adaptive as a controlled leaf with required Value 0 and Enabled true. All 33 typed properties include exact range and secondary track values, continuous/discrete divisions, all six value-indicator modes and nine nullable overlay states. Whole WidgetStateProperty references switch atomically with local states. Finite numbers and signed Infinity are preserved; invalid ranges are rejected without clamping. Secondary null disables its track; Divisions null selects continuous mode. Setting Padding selects Standard; selecting Adaptive resets only Padding in one Undo step. Other properties are retained even when the actual CupertinoSlider branch ignores them. Concrete Booleans use centered checkboxes. Project callbacks, formatter, cursor and focus references are analyzed but never executed in isolated Canvas; disabling retains callbacks and emits only onChanged:null. Optional fields can be reset; Value, Constructor and Enabled cannot be unset. Save/reopen preserves exact typed states.
Widget.Switch.Name=Switch
Widget.Switch.Description=Create Switch or Switch.adaptive as a controlled leaf with required Value false and Enabled true. Both constructors preserve explicit properties, including deprecated Active color. All 201 typed rows include four nullable color state families, nullable track outline widths and nine complete thumb Icon branches. A thumb Icon branch includes all 13 Icon fields; Inherit returns resolver null, while Icon mode with no glyph creates Icon(null). Strict whole WidgetStateProperty references switch atomically with their local family. Active/inactive thumb images reuse declared assets and matching error callbacks; resetting an image removes only its dependent error callback. Apply Cupertino theme selects Adaptive; selecting Standard resets that adaptive-only field. Concrete Booleans use centered checkboxes. Project callbacks and objects are analyzed but never executed in isolated Canvas; Enabled without On changed generates a no-op, while disabled retains callback metadata and emits null. Optional fields can be reset; Value, Constructor and Enabled cannot be unset. Dependent changes form one Undo step and all properties survive save/reopen.
Widget.Checkbox.Description=Create Checkbox or Checkbox.adaptive with all 106 editable scalar rows. Required Value supports false, true and explicit null (mixed); null enables Tristate atomically, and disabling/resetting Tristate while mixed sets Value false. Concrete Booleans use centered checkboxes. All nine fill and overlay state buckets support literal/theme colors or explicit null fallback, with no fabricated disabled override. Whole WidgetStateProperty<Color?> references switch atomically with local state colors. Side supports plain or stateful borders with eight border/inherit buckets and a typed BorderSide reference. All ten built-in OutlinedBorder shape families and strict project OutlinedBorder references are supported. Includes strict ValueChanged<bool?>, FocusNode and MouseCursor references or 41 cursor presets, visual density, accessibility, colors and splash radius. Enabled without a handler generates a no-op; disabled retains callback metadata and emits null. Optional fields can be reset and survive save/reopen; Value, Constructor and Enabled cannot be unset. One Undo restores dependent fields. Adaptive Apple rendering uses CupertinoCheckbox and may ignore Material-only parameters without discarding them. Project references are analyzed but never executed in isolated Canvas.
Widget.IconButton.Description=Wrap a widget as the required Icon of IconButton, IconButton.filled, IconButton.filledTonal or IconButton.outlined. Selected icon is optional and remains stored in all four constructors, including when Selected is unset or false. All 524 scalar rows are editable: direct layout, visual density, colors, tooltip, feedback, constraints, reviewed MouseCursor presets or typed references; strict activation, hover, FocusNode and WidgetStatesController references; all nine state buckets with 54 leaves each and 12 common style fields. A typed ButtonStyle reference supports project builders and arbitrary state resolution; it switches atomically with all 498 local leaves and one Undo restores the prior style. Concrete Booleans use centered checkboxes; unset Selected preserves the SDK null (non-toggle) state, distinct from false. Explicit null is also retained separately from omission. Enabled generates a no-op onPressed when no project callback is set; disabled suppresses press and long press. Optional values can be reset and survive save/reopen. All constructor changes preserve both icon slots and explicit fields. Material 2 may ignore Material 3 style fields without discarding them. Project references are analyzed but never executed in isolated Canvas. Constructor and Enabled cannot be unset.
Widget.FloatingActionButton.Name=FloatingActionButton
Widget.FloatingActionButton.Description=Create FloatingActionButton, FloatingActionButton.small, FloatingActionButton.large or FloatingActionButton.extended. Standard, Small and Large allow an empty Child; Extended requires the same stable Child as Label and accepts an optional Icon. Move or clear Icon before leaving Extended; a required Label can be replaced but never silently removed. All 78 scalar rows are editable: strict VoidCallback, FocusNode and MouseCursor references or 41 reviewed cursor presets; five elevations; colors, clipping, tap target, tooltip, feedback and constructor behavior; complete 22-field ShapeBorder and 31-field extended TextStyle editors; extended padding and icon-label spacing. Hero tag supports omission, explicit null (disable Hero), String/Integer/Double/Boolean literals and typed non-null Object references without raw Dart code. Equal Hero tags on one route conflict, including the SDK shared default. Constructor-dependent scalar edits and built-in/custom shape or text Paint/color switches are atomic and undoable. Concrete Booleans use centered checkboxes; optional values can be reset and survive save/reopen. Project references are analyzed but never executed in isolated Canvas. Constructor and Enabled cannot be unset.
Widget.FilledButton.Name=FilledButton
Widget.FilledButton.Description=Create FilledButton, FilledButton.icon, FilledButton.tonal or FilledButton.tonalIcon. Standard and Tonal allow an empty Child (child: null); Icon and Tonal icon require a Child emitted as Label. Icon and its alignment survive icon-to-tonalIcon transitions. Move or clear a populated Icon before selecting a non-icon constructor; a required Label can only be replaced, never silently removed. Configure strict project callbacks, FocusNode, WidgetStatesController, autofocus, nullable clipping, and constructor icon alignment. All four constructors omit clipping as Clip.none; explicit null is separately retained for SDK automatic clipping. Concrete Booleans use centered checkboxes. Nine local style buckets resolve disabled/error/dragged/pressed/selected/scrolledUnder/hovered/focused/default, with disabled isolated. All 498 local outline, shape, text, color, size, padding, cursor, feedback and ButtonLayerBuilder leaves are available alongside a complete typed ButtonStyle project reference; whole style and local leaves switch atomically. Project references generate analyzer-verified Dart but never execute in isolated Canvas. Optional fields reset, persist and support Undo/Redo; Constructor and Enabled cannot be unset.
Widget.OutlinedButton.Name=OutlinedButton
Widget.OutlinedButton.Description=Wrap an existing required Child with OutlinedButton or OutlinedButton.icon. Child keeps its stable identity as Label in icon mode; optional Icon must be moved or cleared before selecting Standard and is never silently deleted. Configure strict VoidCallback/ValueChanged<bool> project callbacks, FocusNode, WidgetStatesController, autofocus, nullable clipping, and constructor icon alignment. Both constructors omit clipping as null; explicit null and omission remain distinct stored states. Concrete Booleans use centered checkboxes. Nine local style buckets resolve disabled/error/dragged/pressed/selected/scrolledUnder/hovered/focused/default; disabled is isolated. The full outline, shape, text, color, size, padding, cursor and feedback projection is available alongside typed ButtonLayerBuilder references and a complete ButtonStyle project reference. Whole style and all 498 local leaves switch atomically. Project references generate analyzer-verified Dart but never execute in isolated Canvas. All optional fields reset, persist and support Undo/Redo; Constructor, Enabled and required Child cannot be unset.
Widget.TextButton.Name=TextButton
Widget.TextButton.Description=Wrap an existing required Child with TextButton or TextButton.icon. Child is the stable label in icon mode; the optional Icon is retained until explicitly moved or cleared. Switching to standard or setting Semantic button requires an empty Icon. Configure strict VoidCallback/ValueChanged<bool> project callbacks, FocusNode, WidgetStatesController, autofocus, nullable clipping and semantic button role, constructor icon alignment, and all local style states. Explicit Boolean values use centered checkboxes; null and omission remain distinct. Nine style buckets resolve in disabled/error/dragged/pressed/selected/scrolledUnder/hovered/focused/default order. A complete typed ButtonStyle reference supports arbitrary project styles and state combinations, and local ButtonLayerBuilder references expose background/foreground builders without raw Dart expressions. Whole style and local leaves are mutually exclusive atomic edits. Project references generate analyzer-verified Dart but are never executed in isolated Canvas. Constructor and required Child cannot be unset; all other fields support reset, persistence and Undo/Redo.
Widget.RefreshIndicator.Name=RefreshIndicator
Widget.RefreshIndicator.Description=Wrap the existing required child with Material, Adaptive or No spinner pull-to-refresh behavior. The child is retained through every constructor change; actual refresh needs a vertical ScrollView descendant and short contents may need AlwaysScrollableScrollPhysics. All 13 scalar rows are editable: constructor, displacement, edge offset, colors, signed non-null stroke width, elevation, trigger mode, semantics, typed RefreshCallback and ValueChanged<RefreshIndicatorStatus?> project references, and default/depthZero/all or typed ScrollNotificationPredicate. Unset On refresh generates a required async no-op callback that completes immediately without loading data. No spinner clears its five unsupported visual fields; setting one selects Material. Setting On status change selects No spinner. Shared settings and the child are preserved atomically. Isolated Canvas never executes project callbacks or predicates: explicit On refresh or a custom predicate disables refresh activation with a diagnostic, while On status change skips only the observer. The wrapper and editable child remain visible in every case. Adaptive Apple platforms use the Cupertino spinner and ignore Material background, stroke width and semantics. This is the wrapper, not the standalone RefreshProgressIndicator visual.
Widget.RefreshProgressIndicator.Name=RefreshProgressIndicator
Widget.RefreshProgressIndicator.Description=Create the Material refresh progress visual with all 12 optional fields unset and no child slots; this is not the RefreshIndicator pull-to-refresh wrapper. Configure exact finite Value (Flutter clamps its display), literal/theme colors, stopped literal/theme/null or typed Animation<Color?> valueColor, stroke width/alignment/cap, nonnegative elevation, full physical/directional indicator margin and padding, and semantics. Stroke width has three modes: omission uses constructor default 2.5; explicit inherited null uses the theme or fallback 4; a signed finite number is preserved exactly. Restore Default returns to omission, not null. Dynamic project animations generate Dart but cannot execute in isolated Canvas. No controller, constructor variant, constraints, track gap or Year 2023 arguments are exposed because this constructor does not accept them.
Widget.CircularProgressIndicator.Name=CircularProgressIndicator
Widget.CircularProgressIndicator.Description=Create one circular progress indicator with material and adaptive constructors, 14 optional fields and one required constructor selector; no child slots. Only the material selector is stored on creation. Configure determinate Value or an AnimationController atomically; finite values are preserved while Flutter clamps its display to 0..1. Value color supports stopped literal/theme colors, explicit stopped null, or a typed project Animation<Color?>; project references cannot execute in isolated Canvas. Edit literal/theme colors, stroke width/alignment/cap, full constraints and physical/directional padding, track gap, Year 2023 checkbox, and semantics. Switching to adaptive clears unsupported Color in one undoable edit; setting Color selects material. Adaptive uses Cupertino appearance on iOS/macOS and Material elsewhere; platform-ignored fields remain saved. Restore Default omits optional arguments; the constructor selector cannot be unset.
Widget.LinearProgressIndicator.Name=LinearProgressIndicator
Widget.LinearProgressIndicator.Description=Create a Material linear progress indicator with all 13 optional fields unset and no child slots. Unset Value animates indeterminate progress; finite Value is preserved exactly and Flutter clamps its display to 0..1. Value and AnimationController switch atomically. Configure literal/theme colors, stopped literal/theme/null valueColor or a typed project Animation<Color?>, minimum height, full directional/physical elliptical border radius, stop-indicator color/radius, track gap, Year 2023 checkbox, and semantics labels/values. Negative stop radius hides the stop; minimum height must be positive. Infinity is supported for minimum height, stop radius and track gap. Restore Default omits fields without inventing defaults. Dynamic project references generate Dart but cannot execute in isolated Canvas. New Material 3 appearance requires Year 2023 false; unset follows the SDK/theme, and the Material 2 null stop-color edge is reported explicitly without changing saved values.
Widget.CircleAvatar.Description=Create a circular Material avatar with all nine optional fields unset and an optional Child. Edit literal or theme background/foreground colors, two declared AssetImage/ExactAssetImage/ResizeImage providers and their image-error callbacks, and Radius or Min/Max radius. Foreground image falls back to background image, then background color. Radius and Min/Max radius switch atomically; invalid bounds are rejected, not clamped. Explicit Infinity is supported. Resetting a provider also clears its callback in one undoable edit. Creation requires no asset. Restore Default omits optional fields; no SDK defaults are stored. Network, File and custom image providers are not supported; isolated Canvas does not execute project callbacks.
