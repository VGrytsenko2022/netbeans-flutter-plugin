<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Flutter Designer Form</title>
  </head>
  <body>
    Creates a stateless Flutter widget backed by a Flutter Designer model.
    The Dart source is created only in <code>lib</code> or one of its
    subfolders. Its relative path is mirrored below
    <code>.fd_templates</code>; for example,
    <code>lib/screens/home.dart</code> is paired with
    <code>.fd_templates/screens/home.fd</code>.
  </body>
</html>
