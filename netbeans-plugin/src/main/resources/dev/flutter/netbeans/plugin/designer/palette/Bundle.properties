Widget.ConstrainedBox.Description=Constrain an optional child with required minimum and maximum width and height bounds. Palette creation starts unconstrained; unbounded and expanding axes remain explicit.
Widget.UnconstrainedBox.Description=Let an optional child keep its natural size by removing constraints from both axes or retaining exactly one axis, with explicit alignment, direction, and clipping controls.
Widget.LimitedBox.Description=Apply optional maximum width and height only when the corresponding incoming axis is unbounded, while preserving bounded parent constraints and an optional child.
Widget.OverflowBox.Description=Override any combination of the incoming minimum and maximum width or height constraints, align the optional child, and choose whether this box adopts the largest permitted size or follows its child within the parent constraints.
Widget.Baseline.Description=Position an optional child so its alphabetic or ideographic baseline sits at a required logical-pixel offset from the top. Palette creation starts at offset 24 with the alphabetic baseline.
Widget.IntrinsicHeight.Description=Size an optional child to its intrinsic height before final layout. This adds a speculative layout pass and can be O(N²) in tree depth, so avoid it when constraints can express the layout.
Widget.IntrinsicWidth.Description=Size an optional child to its maximum intrinsic width, optionally snapping width and height to non-negative step multiples while honoring parent constraints. A null or zero stepWidth uses the maximum intrinsic width; a null or zero stepHeight leaves height unconstrained. This adds a speculative layout pass and can be O(N²) in tree depth.
Widget.Offstage.Description=Keep an optional child laid out and active while optionally removing it from paint, hit testing, and the parent layout space. An offstage child can still receive focus and run animations; remove it from the tree instead when hiding it long-term.
Widget.SizedOverflowBox.Description=Request a required logical size while passing the original parent constraints unchanged to an optional child. Parent constraints still constrain this box; alignment positions a differently sized child, which may paint outside the box.
Widget.Transform.Description=Apply a required finite 4×4 Matrix4 to an optional child during painting without changing its layout size, with origin, alignment, transformed-hit-test, and filter-quality controls. Palette creation starts with the identity matrix.
Widget.RotatedBox.Name=RotatedBox
Widget.RotatedBox.Description=Rotate an optional child clockwise by a required signed number of quarter turns before layout. Odd quarter turns swap the child’s width and height; palette creation starts at one quarter turn.
Widget.ListBody.Name=ListBody
Widget.ListBody.Description=Arrange an ordered child list sequentially along a vertical or horizontal main axis, stretching every child to the parent dimension on the cross axis. ListBody does not scroll; palette creation preserves Flutter’s vertical-axis and forward-order defaults.
Widget.OverflowBar.Name=OverflowBar
Widget.OverflowBar.Description=Lay out an ordered child list in one horizontal row while it fits, then switch the same children to a vertical overflow column when their total width exceeds the available width. Palette creation preserves Flutter’s zero spacing, start overflow alignment, downward overflow direction, and ambient text direction defaults.
Widget.GridViewCount.Name=GridView.count
Widget.GridViewCount.Description=Create a static scrolling grid with a required positive cross-axis count and exact ordered children. Palette creation starts with two columns and preserves Flutter’s vertical scrolling, unit child aspect ratio, zero spacing, and default child lifecycle, clipping, semantics, and restoration behavior.
Widget.SingleChildScrollView.Name=SingleChildScrollView
Widget.SingleChildScrollView.Description=Create one optional child inside a vertically or horizontally scrolling viewport. Palette creation preserves Flutter’s vertical, forward, platform-physics, opaque hit-test, hard-edge clipping, inherited keyboard-dismissal, and ambient primary-controller defaults; runtime controller state remains outside this Designer slice.
Widget.ColoredBox.Name=ColoredBox
Widget.ColoredBox.Description=Paint a required solid color behind one optional child using Flutter’s dedicated render object. Palette creation starts with an editable opaque blue literal; anti-aliasing preserves Flutter’s enabled default when unset.
Widget.SafeArea.Name=SafeArea
Widget.SafeArea.Description=Wrap an existing widget so MediaQuery padding keeps it clear of system intrusions on selected sides. The wrapper preserves Flutter’s four enabled sides, zero minimum inset, and disabled bottom-view-padding maintenance defaults until explicitly edited.
Widget.Placeholder.Name=Placeholder
Widget.Placeholder.Description=Draw Flutter’s development placeholder frame and diagonals around one optional child. Omitted color, stroke width, and unbounded-axis fallback dimensions preserve Flutter’s blue-grey, 2, and 400 × 400 defaults.
Widget.Directionality.Name=Directionality
Widget.Directionality.Description=Wrap an existing widget with an explicit inherited text-flow direction. Palette creation starts left-to-right; the required child remains occupied and can only be replaced, while Text direction can be switched between LTR and RTL.
Widget.DecoratedBox.Name=DecoratedBox
Widget.DecoratedBox.Description=Paint a reviewed BoxDecoration behind or in front of one optional child. Palette creation starts with an empty rectangular decoration behind the child; color or theme color, image, border, radius, shadows, gradient, blend mode, and shape remain editable through the typed decoration editor.
Widget.ExcludeSemantics.Name=Exclude Semantics
Widget.ExcludeSemantics.Description=Remove one optional child subtree from Flutter's accessibility semantics tree while preserving its layout, painting, and hit testing. Omission preserves Flutter's excluding=true default; an explicit false keeps descendant semantics.
Widget.IndexedStack.Name=Indexed Stack
Widget.IndexedStack.Description=Lay out every ordered child while painting, hit-testing, and exposing semantics for only the selected index. Omit Index for Flutter's default 0, set an explicit non-negative index to select a child, or set null to show none.
Widget.ClipRect.Name=ClipRect
Widget.ClipRect.Description=Clip one optional child to the widget's rectangular bounds. Omit Clip behavior for Flutter's hard-edge default; custom clippers remain outside the closed Designer model.
